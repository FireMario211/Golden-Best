name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          target: win
        - name: macOS (Intel)
          target: macintel
        - name: macOS (M1)
          target: macm1
        - name: Android32
          target: android32
        - name: Android64
          target: android64
        - name: iOS
          target: ios
        

    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      
      - name: Build the mod
        uses: geode-sdk/build-geode-mod-docker@v1
        with:
          target: ${{ matrix.config.target }}
          upload: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    if: '!cancelled()'
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod-docker/merge@main
        with:
          upload: true
